<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="auth-card p-4 p-sm-5" style="max-width: 480px; margin: auto;">
            <!-- Header -->
            <div class="auth-header">
                <div class="logo-badge shadow-sm" style="background-color: #198754;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h3 class="fw-bold mb-1">Đăng ký tài khoản</h3>
                <p class="text-muted small">Tạo tài khoản ứng viên để tham gia tuyển dụng</p>
            </div>

            <!-- Flash & Error alerts -->
            <div th:replace="~{fragments/flash :: flash-messages}"></div>

            <!-- Register Form -->
            <form th:action="@{/register}"
                  th:object="${form}"
                  method="post"
                  novalidate>

                <!-- Global form errors -->
                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger py-2">
                    <ul class="mb-0 ps-3">
                        <li th:each="err : ${#fields.globalErrors()}"
                            th:text="${err}">
                            Lỗi
                        </li>
                    </ul>
                </div>

                <!-- Giữ nguyên các trường fullName, username,
                     email, password, confirmPassword bên dưới -->
                <!-- Họ và tên -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person-badge"></i></span>
                        <input type="text"
                               id="fullName"
                               th:field="*{fullName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                               placeholder="Ví dụ: Nguyễn Văn An"
                               autofocus required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                        Lỗi họ tên
                    </div>
                </div>

                <!-- Tên đăng nhập -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text"
                               id="username"
                               th:field="*{username}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                               placeholder="4–50 ký tự chữ, số hoặc _"
                               required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                        Lỗi tên đăng nhập
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="email@example.com"
                               required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        Lỗi email
                    </div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password"
                               id="password"
                               th:field="*{password}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               placeholder="Tối thiểu 8 ký tự, có chữ hoa và số"
                               required>
                        <button class="btn btn-outline-secondary toggle-pwd-btn" type="button" data-target="password" title="Hiện / Ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        Lỗi mật khẩu
                    </div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-lock"></i></span>
                        <input type="password"
                               id="confirmPassword"
                               th:field="*{confirmPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập lại mật khẩu..."
                               required>
                        <button class="btn btn-outline-secondary toggle-pwd-btn" type="button" data-target="confirmPassword" title="Hiện / Ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                        Lỗi xác nhận mật khẩu
                    </div>
                </div>

                <!-- Nút Tạo tài khoản -->
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Tạo tài khoản
                </button>
            </form>

            <!-- Footer links -->
            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">
                    Đã có tài khoản?
                    <a th:href="@{/login}" class="fw-semibold text-decoration-none text-success">Đăng nhập ngay</a>
                </p>
                <div class="mt-2">
                    <a th:href="@{/jobs}" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left"></i> Xem việc làm
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Toggle Password Script -->
    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.toggle-pwd-btn').forEach(function (button) {
                    button.addEventListener('click', function () {
                        const targetId = this.getAttribute('data-target');
                        const input = document.getElementById(targetId);
                        const icon = this.querySelector('i');
                        if (input && icon) {
                            const isPassword = input.getAttribute('type') === 'password';
                            input.setAttribute('type', isPassword ? 'text' : 'password');
                            icon.classList.toggle('bi-eye', !isPassword);
                            icon.classList.toggle('bi-eye-slash', isPassword);
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
