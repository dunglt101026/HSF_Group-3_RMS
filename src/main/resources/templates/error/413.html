<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>413 - File quá lớn | RMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<!--
    Spring Boot tự hiện trang này khi máy chủ từ chối dữ liệu gửi lên quá lớn
    (vượt spring.servlet.multipart.max-file-size). Trường hợp thường gặp: nộp CV (UC-18).
-->
<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-sm p-4 p-md-5 text-center" style="max-width: 580px; width: 100%;">
            <div class="mb-3">
                <i class="bi bi-file-earmark-x-fill text-warning" style="font-size: 4rem;"></i>
            </div>
            <h1 class="h3 fw-bold text-dark mb-2">413 — File quá lớn</h1>
            <p class="text-secondary mb-4">
                File bạn gửi lên vượt quá dung lượng cho phép.
                CV chỉ nhận PDF, DOC hoặc DOCX, tối đa 5 MB.
            </p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button type="button" onclick="history.back()" class="btn btn-primary px-4 py-2 fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại chọn file khác
                </button>
                <a th:href="@{/}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i>Về trang chủ
                </a>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted small border-top bg-white">
        &copy; 2026 RMS — Recruitment Management System (Group 3 HSF302)
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
