<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản nhân viên - RMS</title>
    <!-- Chưa có layout/staff; dùng cùng các fragment như SCR-05. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container px-3 py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">
                <h1 class="h3 fw-bold mb-4">Tạo tài khoản nhân viên</h1>

                <div th:replace="~{fragments/flash :: flash-messages}"></div>

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-3 p-sm-4">
                        <form th:action="@{/admin/users/new}" th:object="${form}" method="post" novalidate>
                            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                                <ul class="mb-0 ps-3">
                                    <li th:each="error : ${#fields.globalErrors()}" th:text="${error}">Lỗi</li>
                                </ul>
                            </div>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="fullName" class="form-label fw-semibold">
                                        Họ tên <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                           maxlength="100" autocomplete="name" aria-describedby="fullNameError" required autofocus>
                                    <div id="fullNameError" class="invalid-feedback" th:errors="*{fullName}">Lỗi họ tên</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="username" class="form-label fw-semibold">
                                        Tên đăng nhập <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="username" th:field="*{username}" class="form-control"
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                           minlength="4" maxlength="50" pattern="[A-Za-z0-9_]{4,50}"
                                           autocomplete="off" aria-describedby="usernameHelp usernameError" required>
                                    <div id="usernameHelp" class="form-text">4–50 ký tự chữ cái, số hoặc dấu gạch dưới (_).</div>
                                    <div id="usernameError" class="invalid-feedback" th:errors="*{username}">Lỗi tên đăng nhập</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold">
                                        Email <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" id="email" th:field="*{email}" class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           maxlength="255" autocomplete="off" aria-describedby="emailError" required>
                                    <div id="emailError" class="invalid-feedback" th:errors="*{email}">Lỗi email</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                           maxlength="15" pattern="[0-9]{9,15}" inputmode="numeric"
                                           autocomplete="off" aria-describedby="phoneHelp phoneError">
                                    <div id="phoneHelp" class="form-text">Không bắt buộc; gồm 9–15 chữ số nếu nhập.</div>
                                    <div id="phoneError" class="invalid-feedback" th:errors="*{phone}">Lỗi số điện thoại</div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="role" class="form-label fw-semibold">
                                        Vai trò <span class="text-danger">*</span>
                                    </label>
                                    <select id="role" th:field="*{role}" class="form-select"
                                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''"
                                            aria-describedby="roleError" required>
                                        <option value="">Chọn vai trò</option>
                                        <option value="HR">HR - Nhân viên tuyển dụng</option>
                                        <option value="INTERVIEWER">INTERVIEWER - Người phỏng vấn</option>
                                    </select>
                                    <div id="roleError" class="invalid-feedback" th:errors="*{role}">Lỗi vai trò</div>
                                </div>

                                <div class="col-12">
                                    <label for="password" class="form-label fw-semibold">
                                        Mật khẩu khởi tạo <span class="text-danger">*</span>
                                    </label>
                                    <input type="password" id="password" name="password" class="form-control"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                           minlength="8" autocomplete="new-password"
                                           aria-describedby="passwordHelp passwordError" required>
                                    <div id="passwordHelp" class="form-text">Tối thiểu 8 ký tự, gồm ít nhất 1 chữ hoa và 1 chữ số.</div>
                                    <div id="passwordError" class="invalid-feedback" th:errors="*{password}">Lỗi mật khẩu</div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-person-plus me-1" aria-hidden="true"></i> Tạo tài khoản
                                </button>
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
