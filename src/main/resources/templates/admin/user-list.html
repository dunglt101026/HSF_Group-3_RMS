<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/staff}">
<head>
    <title>Quản lý tài khoản</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h1 class="h3 page-heading mb-0">Quản lý tài khoản</h1>
            <a th:href="@{/admin/users/new}" class="btn btn-primary">
                <i class="bi bi-person-plus me-1" aria-hidden="true"></i> Tạo tài khoản
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-body">

                <form th:action="@{/admin/users}" method="get" class="row g-3 align-items-end">
                    <div class="col-12 col-lg-5">
                        <label for="keyword" class="form-label fw-semibold">Từ khóa</label>
                        <input type="search" id="keyword" name="keyword" class="form-control"
                               th:value="${keyword}" maxlength="255"
                               th:classappend="${invalidField == 'keyword'} ? 'is-invalid' : ''"
                               placeholder="Tên đăng nhập, email hoặc họ tên">
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <label for="role" class="form-label fw-semibold">Vai trò</label>
                        <select id="role" name="role" class="form-select"
                                th:classappend="${invalidField == 'role'} ? 'is-invalid' : ''">
                            <option value="">Tất cả</option>
                            <option th:if="${invalidField == 'role'}" th:value="${role}" selected
                                    th:text="|Không hợp lệ: ${role}|">Không hợp lệ</option>
                            <option value="ADMIN" th:selected="${role == 'ADMIN'}">Quản trị viên</option>
                            <option value="HR" th:selected="${role == 'HR'}">Nhân viên tuyển dụng</option>
                            <option value="INTERVIEWER" th:selected="${role == 'INTERVIEWER'}">Người phỏng vấn</option>
                            <option value="CANDIDATE" th:selected="${role == 'CANDIDATE'}">Ứng viên</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <label for="status" class="form-label fw-semibold">Trạng thái</label>
                        <select id="status" name="status" class="form-select"
                                th:classappend="${invalidField == 'status'} ? 'is-invalid' : ''">
                            <option value="">Tất cả</option>
                            <option th:if="${invalidField == 'status'}" th:value="${status}" selected
                                    th:text="|Không hợp lệ: ${status}|">Không hợp lệ</option>
                            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Hoạt động</option>
                            <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Đã khóa</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-2 d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">Tìm / lọc</button>
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Xóa bộ lọc</a>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${invalidField == 'page'}" class="mb-3">
            <a th:href="@{/admin/users(keyword=${keyword},role=${role},status=${status},page=0)}"
               class="btn btn-outline-primary">Về trang đầu</a>
        </div>

        <section th:if="${users != null}" aria-label="Danh sách tài khoản"
                 class="card border-0 shadow-sm rounded-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="min-width: 760px;">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-3">Họ tên</th>
                            <th scope="col">Tên đăng nhập</th>
                            <th scope="col">Email</th>
                            <th scope="col">Vai trò</th>
                            <th scope="col">Trạng thái</th>
                            <th scope="col" class="pe-3">Ngày tạo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users.content}">
                            <td class="ps-3 text-break">
                                <a th:href="@{/admin/users/{id}(id=${user.id})}"
                                   class="fw-semibold" th:text="${user.fullName}">Họ tên</a>
                            </td>
                            <td class="text-break">
                                <a th:href="@{/admin/users/{id}(id=${user.id})}"
                                   th:text="${user.username}">username</a>
                            </td>
                            <td class="text-break" th:text="${user.email}">email@example.com</td>
                            <td th:switch="${user.role.name()}">
                                <span th:case="'ADMIN'">Quản trị viên</span>
                                <span th:case="'HR'">Nhân viên tuyển dụng</span>
                                <span th:case="'INTERVIEWER'">Người phỏng vấn</span>
                                <span th:case="'CANDIDATE'">Ứng viên</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${user.status.name() == 'ACTIVE'} ? 'Hoạt động' : 'Đã khóa'">Trạng thái</span>
                            </td>
                            <td class="pe-3 text-nowrap" th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">
                                01/01/2026 08:00
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="6" class="text-center text-muted py-5">Không tìm thấy tài khoản phù hợp.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-body border-top">
                <span th:if="${users.totalPages <= 1}" class="text-muted small"
                      th:text="|Tổng số: ${users.totalElements} tài khoản|">Tổng số: 0 tài khoản</span>
                <div th:replace="~{fragments/pagination :: pagination(
                        ${users}, @{~/admin/users(keyword=${keyword},role=${role},status=${status})})}"></div>
            </div>
        </section>
    </div>
</body>
</html>
