<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Đổi mật khẩu</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="auth-card p-4 p-sm-5" style="max-width: 460px; margin: auto;">

            <div class="auth-header">
                <div class="logo-badge shadow-sm" style="background-color: #6f42c1;">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h3 class="fw-bold mb-1">Đổi mật khẩu</h3>
                <p class="text-muted small">Cập nhật mật khẩu mới để bảo mật tài khoản</p>
            </div>


            <div th:replace="~{fragments/flash :: flash-messages}"></div>


            <form th:action="@{/profile/password}" th:object="${form}" method="post" novalidate>

                <div class="mb-3">
                    <label for="currentPassword" class="form-label fw-semibold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password"
                               id="currentPassword"
                               th:field="*{currentPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập mật khẩu hiện tại..."
                               autofocus required>
                        <button class="btn btn-outline-secondary toggle-pwd-btn" type="button" data-target="currentPassword" title="Hiện / Ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">
                        Lỗi mật khẩu hiện tại
                    </div>
                </div>


                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-lock"></i></span>
                        <input type="password"
                               id="newPassword"
                               th:field="*{newPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                               placeholder="Tối thiểu 8 ký tự, có chữ hoa và số"
                               required>
                        <button class="btn btn-outline-secondary toggle-pwd-btn" type="button" data-target="newPassword" title="Hiện / Ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">
                        Lỗi mật khẩu mới
                    </div>
                </div>


                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-check"></i></span>
                        <input type="password"
                               id="confirmPassword"
                               th:field="*{confirmPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập lại mật khẩu mới..."
                               required>
                        <button class="btn btn-outline-secondary toggle-pwd-btn" type="button" data-target="confirmPassword" title="Hiện / Ẩn mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                        Lỗi xác nhận mật khẩu
                    </div>
                </div>


                <div class="d-flex gap-2">
                    <a th:href="@{/profile}" class="btn btn-outline-secondary w-50 py-2">
                        <i class="bi bi-x-circle me-1"></i> Hủy
                    </a>
                    <button type="submit" class="btn btn-primary w-50 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Đổi mật khẩu
                    </button>
                </div>
            </form>
        </div>
    </div>


    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.toggle-pwd-btn').forEach(function (button) {
                    button.addEventListener('click', function () {
                        const targetId = this.getAttribute('data-target');
                        const input = document.getElementById(targetId);
                        const icon = this.querySelector('i');
                        if (input && icon) {
                            const isPassword = input.getAttribute('type') === 'password';
                            input.setAttribute('type', isPassword ? 'text' : 'password');
                            icon.classList.toggle('bi-eye', !isPassword);
                            icon.classList.toggle('bi-eye-slash', isPassword);
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
