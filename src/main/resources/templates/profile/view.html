<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Thông tin cá nhân</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="auth-card p-4 p-sm-5" style="max-width: 520px; margin: auto;">
            <!-- Header -->
            <div class="auth-header">
                <div class="logo-badge shadow-sm" style="background-color: #0dcaf0;">
                    <i class="bi bi-person-circle"></i>
                </div>
                <h3 class="fw-bold mb-1">Thông tin cá nhân</h3>
                <p class="text-muted small">Quản lý tài khoản và bảo mật</p>
            </div>

            <!-- Flash alerts -->
            <div th:replace="~{fragments/flash :: flash-messages}"></div>

            <!-- Profile Info Table -->
            <div class="card border-0 bg-light mb-4 shadow-sm">
                <div class="card-body">
                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted small fw-semibold">Họ và tên:</div>
                        <div class="col-sm-8 fw-bold" th:text="${user.fullName}">Nguyễn Văn An</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted small fw-semibold">Tên đăng nhập:</div>
                        <div class="col-sm-8 font-monospace" th:text="${user.username}">candidate1</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted small fw-semibold">Email:</div>
                        <div class="col-sm-8" th:text="${user.email}">user@example.com</div>
                    </div>
                    <div class="row mb-2" th:if="${user.phone != null and !user.phone.isEmpty()}">
                        <div class="col-sm-4 text-muted small fw-semibold">Số điện thoại:</div>
                        <div class="col-sm-8" th:text="${user.phone}">0901234567</div>
                    </div>
                    <div class="row">
                        <div class="col-sm-4 text-muted small fw-semibold">Vai trò:</div>
                        <div class="col-sm-8">
                            <span class="badge bg-primary" th:text="${user.role}">CANDIDATE</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="d-grid gap-2">
                <a th:href="@{/profile/password}" class="btn btn-primary py-2 fw-semibold shadow-sm">
                    <i class="bi bi-key-fill me-1"></i> Đổi mật khẩu
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger w-100 py-2">
                        <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                    </button>
                </form>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <a th:href="@{/demo}" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left"></i> Về trang kiểm tra hệ thống
                </a>
            </div>
        </div>
    </div>
</body>
</html>
