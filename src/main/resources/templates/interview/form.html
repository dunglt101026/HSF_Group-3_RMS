<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/staff}">

<head>
    <title>Lên lịch phỏng vấn</title>
</head>

<body>
<main layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">

            <a th:href="@{/applications/{id}(id=${scheduleForm.applicationId})}" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Quay lại hồ sơ
            </a>

            <h1 class="h3 page-heading mt-3 mb-4">
                <i class="bi bi-calendar-plus me-2"></i>Lên lịch phỏng vấn
            </h1>

            <div class="card">
                <div class="card-body p-4">


                    <dl class="row gy-2 mb-4">
                        <dt class="col-sm-4">Ứng viên</dt>
                        <dd class="col-sm-8 mb-0" th:text="${scheduleForm.candidateName}">Ứng viên</dd>

                        <dt class="col-sm-4">Vị trí</dt>
                        <dd class="col-sm-8 mb-0" th:text="${scheduleForm.jobTitle}">Vị trí</dd>

                        <dt class="col-sm-4">Vòng</dt>
                        <dd class="col-sm-8 mb-0" th:text="'Vòng ' + ${scheduleForm.nextRoundNo}">Vòng 1</dd>
                    </dl>

                    <div th:if="${#lists.isEmpty(scheduleForm.interviewers)}" class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        Hiện không có người phỏng vấn khả dụng (tài khoản HR / Interviewer đang hoạt động).
                    </div>

                    <form th:action="@{/applications/{id}/interviews/new(id=${scheduleForm.applicationId})}"
                          th:object="${form}" method="post" novalidate>

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0">Lỗi</p>
                        </div>

                        <div class="mb-3">
                            <label for="interviewerId" class="form-label required">Người phỏng vấn</label>
                            <select id="interviewerId" th:field="*{interviewerId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('interviewerId')} ? 'is-invalid'">
                                <option value="">-- Chọn người phỏng vấn --</option>
                                <option th:each="person : ${scheduleForm.interviewers}"
                                        th:value="${person.id}"
                                        th:text="${person.fullName} + ' (' + ${person.role} + ')'">Người phỏng vấn</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{interviewerId}">Lỗi</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="scheduledDate" class="form-label required">Ngày</label>
                                <input type="date" id="scheduledDate" th:field="*{scheduledDate}" class="form-control"
                                       th:classappend="${#fields.hasErrors('scheduledDate')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{scheduledDate}">Lỗi</div>
                            </div>
                            <div class="col-sm-6">
                                <label for="scheduledTime" class="form-label required">Giờ</label>
                                <input type="time" id="scheduledTime" th:field="*{scheduledTime}" class="form-control"
                                       th:classappend="${#fields.hasErrors('scheduledTime')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{scheduledTime}">Lỗi</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="location" class="form-label required">Địa điểm hoặc link họp</label>
                            <input type="text" id="location" th:field="*{location}" class="form-control"
                                   maxlength="500" placeholder="VD: Phòng họp 301 hoặc https://meet.google.com/..."
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{location}">Lỗi</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:disabled="${#lists.isEmpty(scheduleForm.interviewers)}">
                                <i class="bi bi-save me-1"></i>Lưu lịch
                            </button>
                            <a th:href="@{/applications/{id}(id=${scheduleForm.applicationId})}"
                               class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
