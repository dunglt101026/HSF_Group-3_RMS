
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
<!--      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"-->
<!--      layout:decorate="~{layout/staff}">-->

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <title>Quản lý tin tuyển dụng</title>
</head>
<body>

<main class="container-fluid py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Quản lý tin tuyển dụng</h2>
      <p class="text-muted mb-0">
        Danh sách các tin tuyển dụng trong hệ thống
      </p>
    </div>
  </div>

  <!-- Bộ lọc -->
  <form method="get"
        th:action="@{/hr/jobs}"
        class="card card-body mb-4">

    <div class="row g-3 align-items-end">

      <div class="col-md-6">
        <label for="keyword" class="form-label">
          Tìm theo tiêu đề
        </label>
        <input type="text"
               id="keyword"
               name="keyword"
               class="form-control"
               placeholder="Nhập tên vị trí..."
               th:value="${keyword}">
      </div>

      <div class="col-md-3">
        <label for="status" class="form-label">
          Trạng thái
        </label>
        <select id="status" name="status" class="form-select">
          <option value="">Tất cả trạng thái</option>

          <option th:each="item : ${statuses}"
                  th:value="${item}"
                  th:text="${item}"
                  th:selected="${item == selectedStatus}">
          </option>
        </select>
      </div>

      <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          Tìm kiếm
        </button>

        <a th:href="@{/hr/jobs}" class="btn btn-outline-secondary">
          Xóa lọc
        </a>
      </div>

    </div>
  </form>

  <!-- Bảng danh sách -->
  <div class="card">
    <div class="card-body">

      <div class="d-flex justify-content-between mb-3">
        <h5 class="mb-0">Danh sách tin</h5>
        <span class="text-muted"
              th:text="'Tổng: ' + ${jobs.totalElements} + ' tin'">
                </span>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
          <tr>
            <th>Tiêu đề</th>
            <th>Phòng ban</th>
            <th>HR phụ trách</th>
            <th>Trạng thái</th>
            <th>Hạn nộp</th>
            <th>Số hồ sơ</th>
            <th>Thao tác</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="job : ${jobs.content}">
            <td>
              <a th:href="@{/hr/jobs/{id}(id=${job.id})}"
                 class="fw-semibold text-decoration-none"
                 th:text="${job.title}">
              </a>
            </td>

            <td th:text="${job.departmentName}"></td>
            <td th:text="${job.ownerName}"></td>

            <td>
                            <span th:switch="${job.status.name()}">
                                <span th:case="'DRAFT'"
                                      class="badge text-bg-secondary">
                                    Nháp
                                </span>
                                <span th:case="'ACTIVE'"
                                      class="badge text-bg-success">
                                    Đang tuyển
                                </span>
                                <span th:case="'CLOSED'"
                                      class="badge text-bg-dark">
                                    Đã đóng
                                </span>
                            </span>
            </td>

            <td th:text="${job.deadline}"></td>

            <td th:text="${job.applicationCount}"></td>

            <td>
              <a th:href="@{/hr/jobs/{id}(id=${job.id})}"
                 class="btn btn-sm btn-outline-primary">
                Chi tiết
              </a>
            </td>
          </tr>

          <tr th:if="${jobs.empty}">
            <td colspan="7"
                class="text-center text-muted py-4">
              Không tìm thấy tin tuyển dụng nào.
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Phân trang -->
      <nav th:if="${jobs.totalPages > 1}"
           aria-label="Job pagination">

        <ul class="pagination justify-content-end mb-0">

          <li class="page-item"
              th:classappend="${jobs.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/hr/jobs(
                               page=${jobs.number - 1},
                               keyword=${keyword},
                               status=${selectedStatus}
                           )}">
              Trước
            </a>
          </li>

          <li class="page-item disabled">
                        <span class="page-link"
                              th:text="${jobs.number + 1} + ' / ' + ${jobs.totalPages}">
                        </span>
          </li>

          <li class="page-item"
              th:classappend="${jobs.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/hr/jobs(
                               page=${jobs.number + 1},
                               keyword=${keyword},
                               status=${selectedStatus}
                           )}">
              Sau
            </a>
          </li>

        </ul>
      </nav>

    </div>
  </div>

</main>

</body>
</html>
