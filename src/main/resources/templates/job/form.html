<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/staff}">

<head>
    <title th:text="${pageTitle}">Tin tuyển dụng</title>
</head>

<body>
<main layout:fragment="content">

    <div class="mb-4">
        <a th:href="${job != null ? '/hr/jobs/' + job.id : '/hr/jobs'}"
           class="text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>

        <h2 class="page-heading mt-3 mb-1" th:text="${pageTitle}"></h2>
        <p class="text-muted mb-0">
            Điền đầy đủ thông tin tin tuyển dụng bên dưới.
        </p>
    </div>

    <div class="card">
        <div class="card-body p-4">

            <form th:object="${form}"
                  th:action="${formAction}"
                  method="post">

                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">
                    <p class="mb-0"
                       th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                    </p>
                </div>

                <!-- Thông tin cơ bản -->
                <h5 class="fw-bold mb-3">Thông tin cơ bản</h5>

                <div class="row g-3">

                    <div class="col-12">
                        <label class="form-label required" for="title">
                            Tiêu đề tuyển dụng
                        </label>
                        <input id="title"
                               type="text"
                               th:field="*{title}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                               maxlength="200"
                               placeholder="Ví dụ: Java Backend Developer">
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label required" for="departmentId">
                            Phòng ban
                        </label>
                        <select id="departmentId"
                                th:field="*{departmentId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid'">
                            <option value="">-- Chọn phòng ban --</option>
                            <option th:each="department : ${formOptions.departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}">
                            </option>
                        </select>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('departmentId')}"
                             th:errors="*{departmentId}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="location">
                            Địa điểm làm việc
                        </label>
                        <input id="location"
                               type="text"
                               th:field="*{location}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                               maxlength="200"
                               placeholder="Ví dụ: Hà Nội">
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('location')}"
                             th:errors="*{location}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="salaryMin">
                            Lương tối thiểu (VNĐ)
                        </label>
                        <input id="salaryMin"
                               type="number"
                               th:field="*{salaryMin}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('salaryMin')} ? 'is-invalid'"
                               min="0"
                               step="100000"
                               placeholder="Ví dụ: 10000000">
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('salaryMin')}"
                             th:errors="*{salaryMin}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="salaryMax">
                            Lương tối đa (VNĐ)
                        </label>
                        <input id="salaryMax"
                               type="number"
                               th:field="*{salaryMax}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('salaryMax')} ? 'is-invalid'"
                               min="0"
                               step="100000"
                               placeholder="Ví dụ: 20000000">
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('salaryMax')}"
                             th:errors="*{salaryMax}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label required" for="deadline">
                            Hạn nộp hồ sơ
                        </label>
                        <input id="deadline"
                               type="date"
                               th:field="*{deadline}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('deadline')} ? 'is-invalid'">
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('deadline')}"
                             th:errors="*{deadline}">
                        </div>
                    </div>

                </div>

                <hr class="my-4">

                <!-- Mô tả -->
                <h5 class="fw-bold mb-3">Mô tả công việc</h5>

                <div class="mb-4">
                    <label class="form-label required" for="description">
                        Nội dung mô tả
                    </label>
                    <textarea id="description"
                              th:field="*{description}"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                              rows="8"
                              placeholder="Mô tả công việc, trách nhiệm và yêu cầu ứng viên..."></textarea>
                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}">
                    </div>
                </div>

                <hr class="my-4">

                <!-- Kỹ năng -->
                <h5 class="fw-bold mb-3">Kỹ năng yêu cầu</h5>

                <div class="row g-3">
                    <div class="col-md-4 col-sm-6"
                         th:each="skill : ${formOptions.skills}">
                        <div class="form-check border rounded p-3 ps-5">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{skillIds}"
                                   th:value="${skill.id}"
                                   th:id="${'skill-' + skill.id}">

                            <label class="form-check-label"
                                   th:for="${'skill-' + skill.id}"
                                   th:text="${skill.name}">
                            </label>
                        </div>
                    </div>
                </div>

                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('skillIds')}"
                     th:errors="*{skillIds}">
                </div>

                <hr class="my-4">

                <!-- Nút -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="${job != null ? '/hr/jobs/' + job.id : '/hr/jobs'}"
                       class="btn btn-outline-secondary">
                        Hủy
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${job != null ? 'Lưu' : 'Lưu nháp'}"></span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</main>

<th:block layout:fragment="scripts">
    <script>
        const minSalary = document.getElementById("salaryMin");
        const maxSalary = document.getElementById("salaryMax");

        function validateSalary() {
            if (minSalary.value && maxSalary.value) {
                maxSalary.setCustomValidity(
                    Number(maxSalary.value) < Number(minSalary.value)
                        ? "Lương tối đa không được nhỏ hơn lương tối thiểu."
                        : ""
                );
            } else {
                maxSalary.setCustomValidity("");
            }
        }

        minSalary.addEventListener("input", validateSalary);
        maxSalary.addEventListener("input", validateSalary);

        const deadline = document.getElementById("deadline");
        const today = new Date();
        const localToday = new Date(
            today.getTime() - today.getTimezoneOffset() * 60000
        ).toISOString().split("T")[0];

        deadline.min = localToday;
    </script>
</th:block>

</body>
</html>
