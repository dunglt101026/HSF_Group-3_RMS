<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
<!--      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"-->
<!--      layout:decorate="~{layout/staff}">-->
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <title>Chi tiết tin tuyển dụng</title>
</head>
<body>

<main class="container-fluid py-4">

    <div class="mb-4">
        <a th:href="@{/hr/jobs}"
           class="text-decoration-none">
            &larr; Quay lại danh sách
        </a>
    </div>

    <div class="card">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h2 class="mb-2" th:text="${job.title}">
                        Tên vị trí
                    </h2>

                    <p class="text-muted mb-0">
                        <span th:text="${job.departmentName}"></span>
                        <span class="mx-2">|</span>
                        <span th:text="${job.location}"></span>
                    </p>
                </div>

                <span th:switch="${job.status.name()}">
                    <span th:case="'DRAFT'"
                          class="badge text-bg-secondary">
                        Nháp
                    </span>
                    <span th:case="'ACTIVE'"
                          class="badge text-bg-success">
                        Đang tuyển
                    </span>
                    <span th:case="'CLOSED'"
                          class="badge text-bg-dark">
                        Đã đóng
                    </span>
                </span>
            </div>

            <hr>

            <div class="row g-4 mb-4">

                <div class="col-md-4">
                    <div class="text-muted small">Phòng ban</div>
                    <div class="fw-semibold"
                         th:text="${job.departmentName}"></div>
                </div>

                <div class="col-md-4">
                    <div class="text-muted small">HR phụ trách</div>
                    <div class="fw-semibold"
                         th:text="${job.ownerName}"></div>
                </div>

                <div class="col-md-4">
                    <div class="text-muted small">Địa điểm</div>
                    <div class="fw-semibold"
                         th:text="${job.location != null ? job.location : 'Chưa cập nhật'}">
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="text-muted small">Lương tối thiểu</div>
                    <div class="fw-semibold"
                         th:text="${job.salaryMin != null ? job.salaryMin : 'Thỏa thuận'}">
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="text-muted small">Lương tối đa</div>
                    <div class="fw-semibold"
                         th:text="${job.salaryMax != null ? job.salaryMax : 'Thỏa thuận'}">
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="text-muted small">Hạn nộp hồ sơ</div>
                    <div class="fw-semibold"
                         th:text="${job.deadline}"></div>
                </div>

                <div class="col-md-4">
                    <div class="text-muted small">Ngày đăng</div>
                    <div class="fw-semibold"
                         th:text="${job.publishedAt != null ? job.publishedAt : 'Chưa đăng'}">
                    </div>
                </div>

            </div>

            <hr>

            <section class="mb-4">
                <h5>Mô tả công việc</h5>
                <div class="text-break"
                     style="white-space: pre-line"
                     th:text="${job.description}">
                </div>
            </section>

            <section class="mb-4">
                <h5>Kỹ năng yêu cầu</h5>

                <div th:if="${!job.skills.isEmpty()}">
                    <span th:each="skill : ${job.skills}"
                          class="badge text-bg-light border text-dark me-2 mb-2"
                          th:text="${skill}">
                    </span>
                </div>

                <p th:if="${job.skills.isEmpty()}"
                   class="text-muted">
                    Chưa có kỹ năng được cập nhật.
                </p>
            </section>

        </div>
    </div>

</main>

</body>
</html>
