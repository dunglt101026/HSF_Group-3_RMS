# =========================================================================
# FILE CẤU HÌNH GỐC (Commit lên Git)
# Chứa các cấu hình mặc định chung của hệ thống. KHÔNG ĐIỀN MẬT KHẨU VÀO ĐÂY!
# Mọi cấu hình cá nhân (port, password, db url) xin ghi đè ở application-local.properties
# =========================================================================

spring.application.name=rms

# Tự động kích hoạt profile 'local' (nạp application-local.properties nếu có)
spring.profiles.active=local

# ======================== SERVER ========================
server.port=8080

# ======================== THYMELEAF ========================
# Tắt cache để sửa template là thấy ngay (prefix/suffix/encoding đã đúng mặc định)
spring.thymeleaf.cache=false

# ======================== DATABASE DEFAULT (MS SQL SERVER) ========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RMS_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=

# ======================== JPA / HIBERNATE ========================
# Entity là nguồn sự thật của schema: Hibernate tự tạo / cập nhật bảng khi chạy app (môi trường dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Cột chuỗi dùng NVARCHAR để lưu được tiếng Việt trên SQL Server
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ======================== LOG ========================
# In câu SQL Hibernate chạy ra console (đi qua logger nên có giờ, dễ tắt hơn show-sql)
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
